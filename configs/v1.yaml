d_model: 256
dropout: 0.1
tw: 20
batch_size: 256
lr: 1.0e-3
epochs: 200
num_workers: 4
# E5 实测（epoch 850）：DDIM 链步数越少越好——10 步 114.5mm vs 50 步 141.4mm
# （每步注入一次 head 的 F 读出误差并沿运动链累积，远端踝部放大到 168-202mm）。
diffusion_train_steps: 200
diffusion_sample_steps: 10
# PoseHead 解码器层数（MDM/RoHM 式 prepend-timestep + 跨层 cross-attn，默认 6）
pose_layers: 6
# E2 多任务损失均衡：姿态是主任务，加大权重（原 1.0）。
# E3：接触损失彻底移除（原 0.1）——E2 中 BCE 爆炸到 61-87，即使 0.01 权重仍
# 占总 loss 0.6-0.9，是 dominant 噪声源且梯度经 1/0.02 的 sigmoid 斜率放大。
lambda_pose: 3.0
lambda_traj: 1.0
lambda_trec: 0.1
lambda_vrec: 0.1
lambda_kp: 1.0
lambda_con: 0.0
traj_velocity_w: 1.0
traj_delta_w: 1.0
traj_delta_weight_power: 1.0
traj_deltas: [2, 4, 8, 19]
# Config order is [VT, V-only, T-only]. Values are normalized when sampled.
config_probs: [0.50, 0.25, 0.25]
cam_id: 3
seq_root: /data/fangyuxuan/projects/gait/AnysoleWorkspace/derived/MotionPRO/sequences/cam3
split_csv: /data/fangyuxuan/projects/gait/AnysoleWorkspace/splits/default/splits.csv
cache_root: /data/fangyuxuan/projects/gait/AnysoleWorkspace/derived/AnySole/hrnet_cache/cam3
out_dir: /data/fangyuxuan/projects/gait/AnySole/outputs/v1
use_insole_drift: false
modal: anysolev1
# Test5 接触检测方案（results_display/README.md ## Test5）：tactile_abs = 原 contact.npy 口径；
# 其他方案读取 contact_<method>.npy，需先用 results_display/script/contact_methods.py 生成。
contact_method: tactile_abs
template_path: /data/fangyuxuan/projects/gait/AnysoleWorkspace/calibration/insole_templates.json
