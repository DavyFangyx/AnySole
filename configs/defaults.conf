# configs/defaults.conf — R_Test 体系公共默认值（对齐 SurvPGC configs/defaults.conf 的角色）
#
# 单一可编辑默认源：configs/z_gen/common.py 读它构建
# COMMON 默认值，configs/run.sh 执行带 TASK/EXPERIMENT_ID 的 conf 时也
# source 它（baseline 型 conf 不受影响）。具体 conf 里的同名键会覆盖这里的值。
#
# 注意：每行格式必须是 KEY=VALUE（无引号）；注释行以 # 开头，行尾 # 注释也允许。

# ---- 模型配置 ----
CONFIG=anysole/configs/v1.yaml      # 模型私有 YAML（train/eval/rho_grid 共用）
MODAL=anysolev2                     # 网络架构；模型实验名由 MODELS[].name -> --model-name
CONTACT_METHOD=joint_and            # 接触判据

# ---- 结果目录 ----
RESULTS_ROOT=results                # 实验产物根（results/<EXPERIMENT_ID>/...）
DISPLAY_ROOT=results_display        # 展示产物根（results_display/<EXPERIMENT_ID>/...）

# ---- 训练默认 ----
DEVICE=cuda
TRAIN_SEED=1
EPOCHS=800
BATCH_SIZE=256

# ---- 协议/展示 ----
PROTOCOL_SEED=0                     # eval 协议种子
# Display is a separate results_display step; it is never queued.
DISPLAY=false
